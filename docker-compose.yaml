services:
    mongodb:
        image: mongo:7
        container_name: mongodb
        command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
        healthcheck:
            test: ['CMD-SHELL', 'mongosh --quiet --eval "try { quit(db.hello().isWritablePrimary ? 0 : 1) } catch (e) { quit(1) }" || mongosh --quiet --eval "try { rs.initiate({_id: ''rs0'', members: [{_id: 0, host: ''mongodb:27017''}]}); quit(1) } catch (e) { quit(1) }"']
            interval: 10s
            timeout: 10s
            retries: 12
        ports:
            - '127.0.0.1:27017:27017'
        volumes:
            - mongodb_data:/data/db
        restart: unless-stopped

    ollama:
        image: ollama/ollama
        container_name: ollama
        profiles:
            - chatbot
        ports:
            - '11434:11434'
        volumes:
            - ollama_data:/root/.ollama
        restart: unless-stopped
        entrypoint: >
            sh -c "
              /bin/ollama serve & 
              sleep 2 && 
              /bin/ollama run GandalfBaum/llama3.2-claude3.7 && 
              tail -f /dev/null
            "

    backend:
        build: ./server
        container_name: backend
        restart: always
        ports:
            - '127.0.0.1:3000:3000'
        env_file:
            - ./server/.env
        environment:
            - CONNECT_DB=mongodb://mongodb:27017/watch?replicaSet=rs0
            - TRUST_PROXY=loopback,linklocal,uniquelocal
        volumes:
            - ./server:/app
        depends_on:
            mongodb:
                condition: service_healthy
        command: sh -c "npm install && npm run dev"

    nginx:
        image: nginx:alpine
        container_name: nginx
        ports:
            - '80:80'
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./client/dist:/usr/share/nginx/html
        depends_on:
            - backend

volumes:
    ollama_data:
    mongodb_data:
        name: banongho_mongodb_data
        external: true
